  <text x="116" y="1296" fill="#ffffff" font-family="DM Sans, Arial, sans-serif" font-size="24">Preventivo confermato entro la scadenza.</text>
  <text x="1080" y="1358" text-anchor="end" fill="#aebed4" font-family="DM Mono, monospace" font-size="22" letter-spacing="2">4 WEB LAB</text>
