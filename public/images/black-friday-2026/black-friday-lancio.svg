<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Black Friday 2026 4 Web Lab</title>
  <desc id="desc">Porta online la tua attività con il 25 per cento di sconto sulla realizzazione iniziale di un nuovo sito.</desc>
  <rect width="1200" height="1500" fill="#101a2d"/>
  <rect x="72" y="78" width="1056" height="1344" fill="none" stroke="#ffffff" stroke-opacity=".28"/>
