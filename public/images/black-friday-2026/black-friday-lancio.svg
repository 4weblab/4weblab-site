  <text x="116" y="176" fill="#d7f54a" font-family="DM Mono, monospace" font-size="23" letter-spacing="4">BLACK FRIDAY 2026</text>
  <text x="116" y="348" fill="#ffffff" font-family="Georgia, serif" font-size="112" font-weight="700">Porta online</text>
  <text x="116" y="468" fill="#ffffff" font-family="Georgia, serif" font-size="112" font-weight="700">la tua</text>
